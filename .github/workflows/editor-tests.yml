name: Editor tests

# Unit tests of the editor's logic (Vitest, in Node), benchmarks of its work
# on a large scene with their budgets, and browser tests of the built editor
# (Playwright; WebGPU runs on the CPU with SwiftShader under a virtual
# display).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run editor:test

      - name: Every browser spec file is in a browser group
        run: |
          for f in editor/test/e2e/*.spec.ts; do
            n=$(basename "$f" .spec.ts)
            grep -qE "files:.*\b$n\b" .github/workflows/editor-tests.yml || { echo "::error::$f is in no group of the browser job"; exit 1; }
          done

      - name: Benchmarks within their budgets
        run: pnpm run editor:bench

  browser:
    runs-on: ubuntu-latest
    # Two groups of spec files, run side by side: SwiftShader draws on the
    # CPU, so each file's editor page takes half a minute to compile its
    # shaders, and one machine takes about five minutes for the whole suite
    # (a CI runner about twice that). The groups are balanced by how long
    # their files take; a spec file added later goes into the lighter group.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            files: effects smoke
          - shard: 2
            files: assets assistant
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build editor
        run: pnpm run editor:build

      - name: Browser tests
        run: xvfb-run -a pnpm run editor:e2e $(for f in ${{ matrix.files }}; do printf 'test/e2e/%s.spec.ts ' "$f"; done)
        timeout-minutes: 15

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: editor/test-results
